[project]
name = "sanskrit-corpus"
version = "0.1.0"
description = "Local-first acquisition tools for a traceable Sanskrit corpus."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastjsonschema>=2.21.0",
    "indic-transliteration>=2.3.82",
    "pyarrow>=24.0.0",
]

[project.scripts]
sanskrit-corpus = "sanskrit_corpus.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:codecs.open\\(\\) is deprecated.*:DeprecationWarning:indic_transliteration.*",
]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
